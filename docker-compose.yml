services:
  db:
    image: postgres:16
    container_name: stock-data-service-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-stock_data}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      # Host publish port (do not reuse POSTGRES_PORT from host .env — that is 5432 for local PG)
      - "${POSTGRES_PUBLISH_PORT:-15432}:5432"
    volumes:
      - ./postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-appuser} -d ${POSTGRES_DB:-stock_data}",
        ]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-data-service-api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      POSTGRES_DB: ${POSTGRES_DB:-stock_data}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      DATA_ROOT: /data/cache
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_MIN_INTERVAL: ${TUSHARE_MIN_INTERVAL:-0.35}
      TUSHARE_REPORT_RC_INTERVAL: ${TUSHARE_REPORT_RC_INTERVAL:-61}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    ports:
      - "${APP_PORT:-8002}:8002"
    volumes:
      - ./data/cache:/data/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
