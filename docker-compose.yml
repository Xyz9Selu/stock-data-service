# API only — uses existing host PostgreSQL (no db service).
# Default: host.docker.internal:5432 (Linux: extra_hosts host-gateway)

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-data-service-api
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # Always reach host PG from container (ignore .env POSTGRES_HOST=127.0.0.1)
      POSTGRES_HOST: host.docker.internal
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-stock_data}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      DATA_ROOT: /data/cache
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_MIN_INTERVAL: ${TUSHARE_MIN_INTERVAL:-0.35}
      TUSHARE_REPORT_RC_INTERVAL: ${TUSHARE_REPORT_RC_INTERVAL:-61}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    ports:
      - "${APP_PORT:-8002}:8002"
    volumes:
      - ./data/cache:/data/cache
    # Bind-mounted cache is host-owned; run as root so writes don't hit EACCES
    user: "0:0"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3
