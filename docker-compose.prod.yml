# Production: API only against external PostgreSQL (no db container).
# Set POSTGRES_* in .env to the real DB host.

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      # External/host PG — set POSTGRES_HOST in .env for remote DBs; default host gateway
      POSTGRES_HOST: ${DOCKER_POSTGRES_HOST:-host.docker.internal}
      POSTGRES_PORT: ${POSTGRES_PORT:-5432}
      POSTGRES_DB: ${POSTGRES_DB:-stock_data}
      POSTGRES_USER: ${POSTGRES_USER:-appuser}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      APP_HOST: 0.0.0.0
      APP_PORT: 8002
      DATA_ROOT: /data/cache
      TUSHARE_TOKEN: ${TUSHARE_TOKEN:-}
      TUSHARE_MIN_INTERVAL: ${TUSHARE_MIN_INTERVAL:-0.35}
      TUSHARE_REPORT_RC_INTERVAL: ${TUSHARE_REPORT_RC_INTERVAL:-61}
      CACHE_TTL_HOURS: ${CACHE_TTL_HOURS:-24}
    ports:
      - "${APP_PORT:-8002}:8002"
    volumes:
      - query_cache_prod:/data/cache
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8002/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  query_cache_prod:
